# Grafana for the OSRS GE price dashboards.
#
# Runs Grafana in a container on the SAME host as the InfluxDB 3 Core container
# (see ../../influxdb/). It auto-provisions:
#   - the InfluxDB 3 FlightSQL (SQL) datasource   (../provisioning/datasources)
#   - the dashboard provider + OSRS GE Prices JSON (../provisioning/dashboards,
#                                                    ../dashboards)
#   - the price-deviation alert rule              (../provisioning/alerting)
#
# Bring it up on a fresh machine with:
#     cp .env.example .env       # then edit if desired
#     docker compose up -d
# ...or just run ./run.sh which does the above and waits for health.
#
# Networking: InfluxDB publishes its port (default 8181) on the host. Grafana,
# in its own container, reaches it via host.docker.internal, mapped to the host
# gateway by the `extra_hosts` entry below (works on Linux, macOS, Windows).
#
# Data (users, edited dashboards, alert state) is persisted in the named volume
# `grafana_ge_data`, so it survives `docker compose down`. It is only lost with
# `docker compose down -v` / `./run.sh destroy`.

services:
  grafana:
    image: grafana/grafana:latest
    container_name: ge-grafana
    restart: unless-stopped
    # Make the host reachable as host.docker.internal on Linux too, so the
    # datasource can reach the InfluxDB container's host-published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- InfluxDB 3 connection (consumed by the provisioned datasource) ---
      # Bare host:port of the InfluxDB 3 FlightSQL endpoint as seen from INSIDE
      # this container. Defaults to the host-published port via host.docker.internal.
      GRAFANA_INFLUXDB3_HOST: ${GRAFANA_INFLUXDB3_HOST:-host.docker.internal:8181}
      INFLUXDB3_DATABASE_NAME: ${INFLUXDB3_DATABASE_NAME:-GEItemPrices}
      # Any non-empty value works while InfluxDB runs --without-auth.
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN:-local-dev-token}
      # --- Grafana itself ---
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Install the FlightSQL datasource plugin on startup (required for v3 SQL).
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-influxdata-flightsql-datasource}
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      # Provisioning (read-only): datasource, dashboard provider, alert rule.
      - ../provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON referenced by the dashboard provider.
      - ../dashboards:/var/lib/grafana/dashboards:ro
      # Persistent Grafana state (users, UI edits, alert state).
      - grafana_ge_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  grafana_ge_data:
    name: grafana_ge_data
