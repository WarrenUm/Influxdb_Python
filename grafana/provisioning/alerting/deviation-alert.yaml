# Grafana provisioning: unified alerting rule (InfluxDB 3 Core / SQL).
#
# Rule: fire when the latest avgHighPrice for $itemID deviates from its trailing
# moving average by more than a configured fractional factor (default 0.25 = 25%).
#
# This rule targets the InfluxDB 3 FlightSQL (SQL) datasource
# (uid: influxdb-v3-ge), matching the datasource and dashboard in this folder.
# It replaces the previous v2/Flux implementation.
#
# How it works:
#   - Query A (SQL, on InfluxDB 3): over the last 24h of avgHighPrice for the
#     selected item, compute the trailing average of the most recent N points
#     and the single latest value, then emit one row whose value is the
#     fractional deviation |latest - avg| / avg.
#   - Expression C (threshold): fire when that deviation is greater than the
#     factor.
#
# False-positive guard: the SQL query only emits a deviation row when it has a
# usable latest value and a non-zero average (NULLIF guards divide-by-zero and
# WHERE drops NULL results). Combined with noDataState=OK, the alert cannot fire
# on missing or degenerate inputs.
#
# Tuning:
#   - moving-average window: change `LIMIT 12` in the `recent` CTE (12 points =
#     ~1h at 5-minute granularity).
#   - sensitivity: change the threshold `params: [0.25]` in expression C.
apiVersion: 1

groups:
  - orgId: 1
    name: GE Price Deviation
    folder: OSRS GE
    interval: 5m
    rules:
      - uid: ge-deviation-alert
        title: GE avgHighPrice deviation
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            avgHighPrice for item ${itemID} deviated from its moving average by
            more than the configured factor.
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: influxdb-v3-ge
            model:
              refId: A
              datasource:
                type: influxdata-flightsql-datasource
                uid: influxdb-v3-ge
              format: table
              # Compute fractional deviation of the latest avgHighPrice from the
              # trailing average of the most recent 12 points for this item.
              #   recent  -> the last 12 non-null avgHighPrice samples
              #   agg     -> their average + the single latest sample
              # NULLIF(avg,0) guards divide-by-zero; the outer WHERE drops the
              # row entirely when there is no usable average, so degenerate
              # inputs produce no data (and noDataState=OK => no firing).
              queryText: |
                WITH recent AS (
                  SELECT time, "avgHighPrice"
                  FROM "itemPrice"
                  WHERE "itemID" = '${itemID}'
                    AND "avgHighPrice" IS NOT NULL
                  ORDER BY time DESC
                  LIMIT 12
                ),
                agg AS (
                  SELECT
                    AVG("avgHighPrice")                              AS moving_avg,
                    (SELECT "avgHighPrice" FROM recent
                       ORDER BY time DESC LIMIT 1)                   AS latest_price
                  FROM recent
                )
                SELECT
                  ABS(latest_price - moving_avg) / NULLIF(moving_avg, 0) AS deviation
                FROM agg
                WHERE NULLIF(moving_avg, 0) IS NOT NULL
                  AND latest_price IS NOT NULL
              rawSql: |
                WITH recent AS (
                  SELECT time, "avgHighPrice"
                  FROM "itemPrice"
                  WHERE "itemID" = '${itemID}'
                    AND "avgHighPrice" IS NOT NULL
                  ORDER BY time DESC
                  LIMIT 12
                ),
                agg AS (
                  SELECT
                    AVG("avgHighPrice")                              AS moving_avg,
                    (SELECT "avgHighPrice" FROM recent
                       ORDER BY time DESC LIMIT 1)                   AS latest_price
                  FROM recent
                )
                SELECT
                  ABS(latest_price - moving_avg) / NULLIF(moving_avg, 0) AS deviation
                FROM agg
                WHERE NULLIF(moving_avg, 0) IS NOT NULL
                  AND latest_price IS NOT NULL
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.25
