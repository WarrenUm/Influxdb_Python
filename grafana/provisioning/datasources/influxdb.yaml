# Grafana provisioning: InfluxDB v2 data source in Flux query mode.
#
# The auth token is injected from the INFLUX_TOKEN environment variable at
# Grafana startup (Grafana expands ${ENV_VAR} in provisioning files). Never
# hardcode a token here — keep it in the environment / .env (Req 18.1, 19.6).
apiVersion: 1

datasources:
  - name: InfluxDB-GE
    uid: influxdb-ge
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: Ge-data-project
      defaultBucket: GEItemPrices
      # Increase if you run long-range Flux queries.
      timeout: 60
    secureJsonData:
      token: ${INFLUX_TOKEN}
