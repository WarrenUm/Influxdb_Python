[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ge_pipeline"
version = "0.1.0"
description = "Modernized OSRS Grand Exchange price collection and outlier-detection pipeline."
readme = "README.md"
requires-python = ">=3.10"

# Pinned backend dependencies for a reproducible environment. Versions match
# the working, validated virtualenv used during development.
dependencies = [
    "influxdb-client==1.50.0",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "python-dotenv==1.2.2",
    "httpx==0.27.2",
    "pydantic==2.13.4",
    "typer==0.26.8",
    "apscheduler==3.10.4",
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "pyarrow==24.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "hypothesis==6.155.7",
    "testcontainers==4.14.2",
]

[project.scripts]
ge-pipeline = "ge_pipeline.cli:app"

[tool.setuptools]
packages = ["ge_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Hypothesis is configured via a profile registered in tests/conftest.py.
# The "ci" profile enforces the design's minimum of >=100 examples per property.
